[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C90", "B", "PL"]
ignore = ["PLR0913", "PLR0915", "PLR2004", "E402", "PLC0415", "C901", "PLR0912", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = [
    "bot.py",
    "config.py",
    "dropbox_module.py",
    "epub_functions.py",
    "services/epub_service.py",
    "userbot_db.py",
    "utils",
    "src",
]
