[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C90", "B", "PL"]
ignore = ["PLR0913", "PLR0915", "PLR2004", "E402", "PLC0415", "C901", "PLR0912", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
