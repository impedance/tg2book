
services:
  tg2book:
    build: .
    env_file: .env
    environment:
      CHANNEL_REGISTRY_DB: ${CHANNEL_REGISTRY_DB:-/app/runtime/channels.db}
      USERBOT_SESSION: ${USERBOT_SESSION:-/app/runtime/tg2book_userbot}
    command: ["python", "bot.py"]
    volumes:
      - ./runtime:/app/runtime
    restart: unless-stopped
    init: true
    mem_limit: 768m
    mem_reservation: 512m
    cpus: 0.75
